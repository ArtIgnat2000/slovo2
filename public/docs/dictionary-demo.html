  Словарик 📖 — автономная витрина раздела (один файл, без сборки и сети).

  Сгенерировано из настоящего src/ui/screens/WordsScreen.tsx, src/engine/dictionary.ts
  и src/styles/app.css: esbuild собирает React-компонент в один <script>, стили
  вставляются в <style>. Руками этот файл не правят — после изменения экрана его
  нужно пересобрать (как — в docs/RELEASE-0.69.0.md).

  Зачем: на сайте приложение открывается с пустым прогрессом, а здесь вверху есть
  переключатель трёх профилей (обычный прогресс / только начали / всё выучено),
  тёмная тема и пять стилей оформления — чтобы проверить вид всех четырёх колонок.
-->

  --orange-ink: #ffd166;

  --red-soft: rgba(255, 92, 124, 0.16);
  --on-primary: #081e2b;
  --primary-ink: #48c7d8;

/* src/styles/app.css */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
}
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  overscroll-behavior-y: contain;
  -webkit-font-smoothing: antialiased;
}
button {
  font-family: inherit;
}
#root {
  min-height: 100dvh;
}
.lesson-check [data-hint],
.lesson-check .banner {
  display: none !important;
}
.list-drill {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 10px 0 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}
.list-drill-options {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.list-history {
  flex-basis: 100%;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--line);
}
.list-history-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.list-trend {
  font-size: 12px;
  font-weight: 700;
}
.list-trend.up {
  color: var(--green);
}
.list-trend.down {
  color: var(--orange-ink);
}
.list-bars {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  height: 56px;
  margin: 8px 0 6px;
}
.list-bar {
  flex: 1 1 0;
  min-width: 6px;
  border-radius: 4px 4px 2px 2px;
  background: var(--primary);
  opacity: 0.85;
}
.list-bar.check {
  background: var(--green);
}
.list-bar.errors {
  background: var(--orange);
}
.list-runs {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.list-runs li {
  display: flex;
  gap: 8px;
  align-items: baseline;
}
.list-runs b {
  margin-left: auto;
}
.list-hard {
  margin-top: 8px;
}
.list-card-block {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.list-card-modes {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding-left: 44px;
}
.check-report .kv {
  margin-bottom: 2px;
}
.check-words {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.check-word {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 9px;
  border-radius: 999px;
  font-size: var(--fs-sm);
  font-weight: 700;
  border: 1px solid var(--line);
  background: var(--bg-2);
}
.check-word.ok {
  color: var(--green);
  border-color: color-mix(in srgb, var(--green) 40%, var(--line));
  background: var(--green-soft);
}
.check-word.bad {
  color: var(--red);
  border-color: color-mix(in srgb, var(--red) 45%, var(--line));
  background: var(--red-soft);
}
.list-cards {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 10px;
}
.list-card {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 12px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  text-align: left;
  font: inherit;
  cursor: pointer;
}
.list-card:active {
  transform: scale(0.995);
}
.list-card-icon {
  flex: none;
  width: 34px;
  height: 34px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  font-size: 18px;
  background: var(--primary-soft);
}
.list-card-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1;
}
.list-card-title {
  font-weight: 700;
  font-size: var(--fs-sm);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.list-card-meta {
  font-size: 12px;
  color: var(--ink-2);
}
.list-card-go {
  flex: none;
  font-size: 12px;
  font-weight: 700;
  color: var(--primary-ink);
}
.list-guess {
  color: var(--orange-ink);
  font-weight: 700;
}
.list-guess-badge {
  font-size: 11px;
  font-weight: 700;
  color: var(--orange-ink);
  background: var(--orange-soft);
  border-radius: 999px;
  padding: 2px 8px;
}
.list-presets {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 12px;
}
.list-preset {
  justify-content: flex-start;
  text-align: left;
  border-style: dashed;
}
.list-preset:disabled {
  opacity: 0.7;
  border-style: solid;
}
.list-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.list-row:last-of-type {
  border-bottom: 0;
}
.list-row-main {
  min-width: 0;
  flex: 1;
}
.list-row-title {
  font-weight: 700;
}
.list-row-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.list-row-edit {
  display: flex;
  gap: 8px;
  width: 100%;
  flex-wrap: wrap;
}
.list-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 12px;
}
.list-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.list-textarea {
  resize: vertical;
  min-height: 120px;
  font: inherit;
  line-height: 1.45;
}
.parent-screen .list-form .input {
  padding: 10px 12px;
  font-size: var(--fs-sm);
  border-width: 2px;
}
.list-error {
  color: var(--red);
}
.list-preview {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.list-preview-summary {
  font-size: var(--fs-sm);
  color: var(--ink-2);
}
.list-preview-items {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.list-preview-item {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 6px 8px;
  border-radius: 10px;
  background: var(--bg-2);
  border: 1px solid var(--line);
}
.list-preview-item.dup {
  opacity: 0.6;
}
.list-preview-badge {
  flex: none;
  width: 18px;
  text-align: center;
}
.list-preview-word {
  font-weight: 700;
}
.list-syllables {
  display: inline-flex;
  gap: 4px;
  flex-wrap: wrap;
}
.list-syl {
  font: inherit;
  font-size: 13px;
  padding: 3px 8px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  cursor: pointer;
}
.list-syl.on {
  border-color: var(--primary-ink);
  background: var(--primary-soft);
  font-weight: 700;
}
.list-custom-words {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.list-custom-word {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}
.list-custom-word:last-child {
  border-bottom: 0;
  padding-bottom: 0;
}
.list-custom-word-text b {
  color: var(--primary-ink);
}
.ico {
  flex: 0 0 auto;
  vertical-align: -0.15em;
  display: inline-block;
  overflow: visible;
}
.btn .ico,
.chip .ico {
  vertical-align: -0.2em;
}
.ico .ic-spark {
  animation: icSpark 2.8s ease-in-out infinite;
}
.ico .ic-spark-2 {
  animation-delay: 1.4s;
}
@keyframes icSpark {
  0%, 100% {
    opacity: 0.5;
  }
  50% {
    opacity: 1;
  }
}
@media (prefers-reduced-motion: reduce) {
  .ico .ic-spark {
    animation: none;
  }
}
.gem-amount {
  display: inline-flex;
  align-items: center;
  gap: 0.24em;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.gem-amount > span {
  font-weight: 800;
  letter-spacing: -0.01em;
}
.topbar-stat.gems .gem-amount {
  gap: 0.22em;
}
@media (max-width: 359px) {
  .topbar-stat.gems .ico {
    width: 22px;
    height: 22px;
  }
}
.gem-amount .ico {
  vertical-align: 0;
}
.app {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(
      120% 60% at 15% 0%,
      var(--bg-glow-1) 0%,
      transparent 55%),
    radial-gradient(
      100% 55% at 100% 0%,
      var(--bg-glow-2) 0%,
      transparent 60%),
    var(--bg);
}
.screen {
  flex: 1;
  padding: calc(14px + var(--safe-t)) 16px calc(96px + var(--safe-b));
  max-width: var(--screen-max);
  width: 100%;
  margin: 0 auto;
  animation: fadeIn 0.25s ease;
}
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
h1,
h2,
h3 {
  margin: 0 0 8px;
  letter-spacing: -0.02em;
}
h1 {
  font-size: var(--fs-xl);
  font-weight: 800;
}
h2 {
  font-size: var(--fs-lg);
  font-weight: 800;
}
h3 {
  font-size: var(--fs-md);
  font-weight: 700;
}
p {
  margin: 0 0 8px;
  line-height: 1.45;
}
.muted {
  color: var(--ink-2);
  font-size: var(--fs-sm);
}
.tiny {
  font-size: var(--fs-xs);
  color: var(--ink-2);
  line-height: 1.35;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.between {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.col {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.grow {
  flex: 1;
}
.card {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px;
  box-shadow: var(--shadow);
}
.card.tight {
  padding: 12px 14px;
}
.card.flat {
  box-shadow: none;
  border-color: transparent;
  background: var(--bg-2);
}
.btn {
  border: none;
  border-radius: var(--r-md);
  padding: 14px 18px;
  font-size: var(--fs-md);
  font-weight: 800;
  min-height: var(--tap);
  cursor: pointer;
  background: var(--primary-soft);
  color: var(--primary-ink);
  transition: transform 0.08s ease, filter 0.15s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn:active {
  transform: translateY(2px) scale(0.99);
}
.btn.primary {
  background: var(--primary);
  color: var(--on-primary);
  box-shadow: 0 5px 0 #5b3ede;
}
.btn.primary:active {
  box-shadow: 0 2px 0 #5b3ede;
  transform: translateY(3px);
}
.btn.green {
  background: var(--green);
  color: #fff;
  box-shadow: 0 5px 0 #158f43;
}
.btn.green:active {
  box-shadow: 0 2px 0 #158f43;
  transform: translateY(3px);
}
.btn.ghost {
  background: transparent;
  border: 2px solid var(--line);
  color: var(--ink-2);
}
.btn.danger {
  background: var(--red-soft);
  color: var(--red);
}
.btn.wide {
  width: 100%;
}
.btn.lg {
  min-height: 58px;
  font-size: 20px;
  border-radius: var(--r-md);
}
.btn[disabled] {
  opacity: 0.45;
  pointer-events: none;
}
.btn.sm {
  min-height: 48px;
  padding: 8px 14px;
  font-size: var(--fs-sm);
}
.chip {
  border: 2px solid var(--line);
  background: var(--card);
  border-radius: var(--r-pill);
  padding: 8px 14px;
  font-weight: 700;
  font-size: var(--fs-sm);
  cursor: pointer;
  min-height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.chip.on {
  background: var(--primary);
  color: var(--on-primary);
  border-color: var(--primary);
}
.lesson-exit {
  width: 48px;
  height: 48px;
  min-width: 48px;
  min-height: 48px;
  border-radius: 50%;
  border: 2px solid var(--line);
  background: var(--card);
  color: var(--ink-2);
  font-size: 20px;
  font-weight: 800;
  line-height: 1;
  display: grid;
  place-items: center;
  flex: none;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  position: relative;
  z-index: 1;
}
.lesson-exit:active {
  background: var(--line);
  transform: scale(0.96);
}
@media (hover: none) {
  .lesson-exit {
    position: relative;
  }
  .lesson-exit::after {
    content: "";
    position: absolute;
    inset: -8px;
  }
}
.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--primary-soft);
  display: grid;
  place-items: center;
  font-size: 24px;
  border: 2px solid var(--line);
  cursor: pointer;
}
.profile-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  max-width: 100%;
  min-height: 44px;
  padding: 0;
  background: none;
  border: none;
  border-radius: var(--r-pill);
  color: inherit;
  text-align: left;
  cursor: pointer;
}
.profile-btn .avatar {
  flex: none;
}
.profile-btn:active .avatar {
  transform: scale(0.96);
}
.topbar .grow {
  min-width: 0;
}
.topbar-name {
  min-width: 0;
  overflow: hidden;
  font-weight: 800;
  font-size: 18px;
  line-height: 1.2;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.topbar-stat {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 800;
  font-size: var(--fs-sm);
  line-height: 1.2;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.topbar-stat.gems {
  font-size: 20px;
}
@media (max-width: 359px) {
  .topbar {
    gap: 8px;
  }
  .topbar-name {
    font-size: 16px;
  }
  .topbar-stat {
    font-size: 14px;
    gap: 3px;
  }
  .topbar-stat.gems {
    font-size: 18px;
  }
}
.menu-btn {
  flex: none;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  padding: 0;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--r-pill);
  font-size: 20px;
  line-height: 1;
  color: var(--ink);
  cursor: pointer;
}
.menu-btn[aria-expanded=true] {
  border-color: var(--primary-ink);
}
.stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--r-pill);
  padding: 6px 12px;
  font-weight: 800;
  font-size: var(--fs-sm);
}
.stat-pill.fire {
  color: var(--orange);
}
.stat-pill.xp {
  color: var(--primary-ink);
}
.shop-empty {
  padding: 20px 16px;
  text-align: center;
}
.shop-empty-emoji {
  font-size: 40px;
  line-height: 1;
}
.shop-empty-title {
  margin-top: 6px;
  font-size: var(--fs-lg);
  font-weight: 800;
}
.home-menu {
  display: grid;
  gap: 12px;
}
.menu-status {
  display: grid;
  gap: 10px;
  padding: 12px;
  margin-bottom: 12px;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--r-lg);
}
.menu-status-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.menu-status-emoji {
  flex: none;
  font-size: 20px;
  line-height: 1.2;
}
.menu-status-title {
  font-weight: 800;
}
.menu-list {
  display: grid;
  gap: 8px;
}
.menu-row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 56px;

  grid-template-columns: 1fr;
  gap: 8px;
}
@media (min-width: 520px) {
  .dict-legend-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
}
@media (min-width: 960px) {
  .dict-legend-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
  }
}
.dict-legend-item {
  min-height: 52px;
  width: 100%;
  padding: 10px 12px;
  border-radius: var(--r-md);
  border: 2px solid var(--line);
  background: var(--card);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition:
    transform 0.08s ease,
    border-color 0.15s ease,
    box-shadow 0.15s ease;
}
.dict-legend-item:active {
  transform: scale(0.99);
}
.dict-legend-item.good.active {
  border-color: var(--green);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 26%, transparent);
}
.dict-legend-item.mid.active {
  border-color: var(--orange);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--orange) 28%, transparent);
}
.dict-legend-item.weak.active {
  border-color: var(--red);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 26%, transparent);
}
.dict-legend-item.new.active {
  border-color: var(--primary-ink);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 24%, transparent);
}
.dict-swatch {
  flex: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 15px;
  font-weight: 800;
  border: 2px solid var(--dict-new-ring);
  background: var(--bg);
  color: var(--ink-2);
}
.dict-swatch.good {
  background: var(--green-soft);
  border-color: var(--green);
  color: var(--good-ink);
}
.dict-swatch.mid {
  background: var(--orange-soft);
  border-color: var(--orange);
  color: var(--warn-ink);
}
.dict-swatch.weak {
  background: var(--red-soft);
  border-color: var(--red);
  color: var(--bad-ink);
}
.dict-legend-text {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.dict-legend-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.dict-legend-name {
  font-size: var(--fs-sm);
  font-weight: 800;
  color: var(--ink);
}
.dict-legend-count {
  font-size: var(--fs-xs);
  font-weight: 800;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.dict-legend-desc {
  font-size: var(--fs-xs);
  color: var(--ink-2);
  line-height: 1.3;
}
.dict-search-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.dict-search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--r-md);
  padding: 0 4px 0 14px;
  min-height: 48px;
}
.dict-search-box:focus-within {
  border-color: var(--primary-ink);
}
.dict-search-icon {
  flex: none;
  font-size: 16px;
}
.dict-search-input {
  flex: 1;
  min-width: 0;
  min-height: 48px;
  border: 0;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: var(--fs-sm);
  outline: none;
}
.dict-search-input::placeholder {
  color: var(--ink-2);
}
.dict-search-clear {
  flex: none;
  width: 48px;
  height: 48px;
  min-height: 48px;
  border: 0;
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--ink-2);
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  display: grid;
  place-items: center;
}
.dict-search-status {
  margin: 0;
}
.dict-empty-search {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
}
.dict-empty-title {
  margin: 0;
  font-size: var(--fs-md);
  font-weight: 800;
}
.dict-board {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
  align-items: stretch;
}
@media (min-width: 580px) {
  .dict-board {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (min-width: 960px) {
  .dict-board {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
.dict-board.single {
  grid-template-columns: 1fr;
}
.dict-col {
  background: var(--card);
  border: 2px solid var(--line);
  border-top-width: 5px;
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}
.dict-col-good {
  border-top-color: var(--green);
}
.dict-col-mid {
  border-top-color: var(--orange);
}
.dict-col-weak {
  border-top-color: var(--red);
}
.dict-col-new {
  border-top-color: var(--dict-new-ring);
}
.dict-col-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-2);
}
.dict-col-titles {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.dict-col-title {
  margin: 0;
  font-size: var(--fs-md);
  font-weight: 800;
  color: var(--ink);
  line-height: 1.2;
}
.dict-col-hint {
  font-size: var(--fs-xs);
  color: var(--ink-2);
  line-height: 1.25;
}
.dict-col-count {
  flex: none;
  min-width: 34px;
  height: 30px;
  padding: 0 10px;
  border-radius: var(--r-pill);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: var(--fs-xs);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  border: 1.5px solid var(--line);
  background: var(--bg);
  color: var(--ink-2);
}
.dict-col-count.good {
  background: var(--green-soft);
  border-color: var(--green);
  color: var(--good-ink);
}
.dict-col-count.mid {
  background: var(--orange-soft);
  border-color: var(--orange);
  color: var(--warn-ink);
}
.dict-col-count.weak {
  background: var(--red-soft);
  border-color: var(--red);
  color: var(--bad-ink);
}
.dict-col-body {
  flex: 1;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.dict-col-empty {
  margin: 0;
  padding: 6px 2px;
  font-size: var(--fs-xs);
  color: var(--ink-2);
  line-height: 1.4;
}
.dict-more-btn {
  min-height: 48px;
  width: 100%;
  margin-top: 2px;
}
.dict-col-foot {
  margin-top: auto;
  padding: 10px 14px;
  border-top: 1.5px dashed var(--line);
  background: var(--bg-2);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: var(--fs-xs);
  font-variant-numeric: tabular-nums;
}
.dict-col-total-label {
  font-weight: 800;
  color: var(--ink);
}
.dict-col-total-pct {
  font-weight: 700;
  color: var(--ink-2);
}
.dict-modal-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: var(--r-pill);
  font-size: var(--fs-xs);
  font-weight: 800;
  border: 1.5px solid var(--line);
  background: var(--bg);
  color: var(--ink-2);
}
.dict-modal-status.good {
  background: var(--green-soft);
  border-color: var(--green);
  color: var(--good-ink);
}
.dict-modal-status.mid {
  background: var(--orange-soft);
  border-color: var(--orange);
  color: var(--warn-ink);
}
.dict-modal-status.weak {
  background: var(--red-soft);
  border-color: var(--red);
  color: var(--bad-ink);
}
.banner {
  background: var(--primary-soft);
  border: 2px solid var(--primary);
  border-radius: var(--r-md);
  padding: 12px 14px;
  font-size: var(--fs-sm);
  font-weight: 700;
}
.banner.danger-banner {
  background: var(--wrong-soft, #ffe9e9);
  border-color: var(--wrong, #e05252);
  color: var(--wrong-strong, #a32b2b);
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-start;
}
.banner.danger-banner .btn {
  align-self: flex-start;
}
.banner.theme-banner {
  align-self: center;
  width: calc(100% - 32px);
  max-width: var(--screen-max);
  margin: calc(8px + var(--safe-t)) auto 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-start;
  background: var(--orange-soft);
  border-color: var(--orange);
  color: var(--orange-ink);
  font-weight: 600;
}
.banner.theme-banner .btn {
  align-self: flex-start;
  margin-top: 2px;
}
.theme-banner-hint {
  font-size: var(--fs-xs);
  line-height: 1.35;
}
.warn {
  color: var(--wrong-strong, #a32b2b);
}
.input {
  width: 100%;
  border: 3px solid var(--line);
  border-radius: var(--r-md);
  padding: 14px 16px;
  font-size: var(--fs-md);
  font-family: inherit;
  background: var(--card);
  color: var(--ink);
}
.input:focus {
  outline: none;
  border-color: var(--primary-ink);
}
.avatars {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}
.avatar-pick {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 3px solid var(--line);
  background: var(--card);
  font-size: 28px;
  cursor: pointer;
  display: grid;
  place-items: center;
}
.avatar-pick.on {
  border-color: var(--primary-ink);
  background: var(--primary-soft);
}
.center {
  text-align: center;
}
.mt {
  margin-top: 16px;
}
.row.wrap-center {
  flex-wrap: wrap;
  justify-content: center;
  gap: var(--sp-2);
}
.mb {
  margin-bottom: 16px;
}
.big-emoji {
  font-size: 64px;
  line-height: 1;
}
.vlabs-promo {
  border: 2px solid var(--primary) !important;
  background:
    radial-gradient(
      120% 100% at 100% 0%,
      var(--promo-glow-1) 0%,
      transparent 55%),
    radial-gradient(
      100% 90% at 0% 100%,
      var(--promo-glow-2) 0%,
      transparent 60%),
    var(--card) !important;
  box-shadow: var(--shadow);
  transition: transform 0.08s ease, border-color 0.15s ease;
}
.vlabs-promo:active {
  transform: translateY(1px);
}
.vlabs-promo-icon {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  font-size: 22px;
  background: var(--primary);
  color: #fff;
  flex: none;
}
.vlabs-promo-title {
  font-weight: 800;
  font-size: var(--fs-md);
  color: var(--ink);
  line-height: 1.2;
}
.vlabs-hero {
  border: 2px solid var(--primary) !important;
  background:
    radial-gradient(
      150% 80% at 0% 0%,
      var(--promo-glow-1) 0%,
      transparent 60%),
    radial-gradient(
      120% 80% at 100% 100%,
      var(--promo-glow-2) 0%,
      transparent 65%),
    var(--card) !important;
}
.vlabs-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: var(--r-pill);
  background: var(--primary);
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.vlabs-brand {
  color: var(--primary-ink);
}
.vlabs-tagline {
  font-size: 18px;
  font-weight: 800;
  color: var(--ink);
  margin: 0;
  line-height: 1.2;
}
.vlabs-proof-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}
.vlabs-proof {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-radius: var(--r-pill);
  background: var(--card);
  border: 2px solid var(--line);
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-2);
}
.vlabs-scratch {
  background:
    radial-gradient(
      130% 80% at 100% 0%,
      var(--scratch-glow) 0%,
      transparent 55%),
    var(--card) !important;
  border-color: #f59e0b !important;
}
.vlabs-icon {
  width: 56px;
  height: 56px;
  border-radius: 18px;
  display: grid;
  place-items: center;
  font-size: 30px;
  background: #fff7ed;
  border: 2px solid #fed7aa;
  flex: none;
}
.vlabs-kicker {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #d97706;
}
.vlabs-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.vlabs-chip {
  display: inline-flex;
  padding: 4px 10px;
  border-radius: var(--r-pill);
  background: #fff;
  border: 2px solid #fde68a;
  color: #92400e;
  font-size: 12px;
  font-weight: 800;
}
.vlabs-list {
  margin: 12px 0 0;
  padding-left: 18px;
  font-size: var(--fs-sm);
  color: var(--ink-2);
  line-height: 1.45;
}
.vlabs-list li {
  margin: 4px 0;
}
.vlabs-list li::marker {
  color: #f59e0b;
}
.vlabs-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
@media (min-width: 460px) {
  .vlabs-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}
.vlabs-mini {
  border: 2px solid var(--line);
  background: var(--bg-2);
  border-radius: var(--r-md);
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  text-align: center;
}
.vlabs-mini-ico {
  font-size: 24px;
  line-height: 1;
}
.vlabs-mini b {
  font-size: var(--fs-sm);
  line-height: 1.2;
}
.vlabs-more {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: var(--r-md);
  background: var(--primary-soft);
  border: 2px dashed var(--line);
  font-size: var(--fs-sm);
  color: var(--ink-2);
  text-align: center;
  font-weight: 600;
}
.vlabs-why {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.vlabs-why-item {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.vlabs-why-ico {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 18px;
  background: var(--primary-soft);
  border: 2px solid var(--line);
  flex: none;
}
.vlabs-cta {
  border-color: var(--green) !important;
}
.vlabs-cta h3 {
  color: var(--ink);
}
.diag-screen .kv {
  gap: 12px;
  align-items: flex-start;
}
.diag-screen .kv span {
  color: var(--ink-2);
}
.diag-screen .kv b {
  text-align: right;
  overflow-wrap: anywhere;
}
.diag-ok {
  color: var(--green);
}
.diag-warn {
  color: var(--orange);
}
.diag-error {
  color: var(--red);
}
.diag-snapshots {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.diag-snapshot {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  font-size: var(--fs-sm);
}
.diag-snapshot:last-child {
  border-bottom: 0;
}
.diag-snapshot span:nth-child(even) {
  text-align: right;
}
.diag-snapshot .diag-error {
  grid-column: 1 / -1;
  text-align: left !important;
}
.diag-notice {
  text-align: center;
  margin: -4px 0 12px;
}
.diag-copy summary {
  cursor: pointer;
  font-weight: 800;
}
.diag-copy pre {
  margin: 12px 0 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font:
    12px/1.5 ui-monospace,
    SFMono-Regular,
    Consolas,
    monospace;
  color: var(--ink-2);
}
.costume-grid {
  grid-template-columns: repeat(2, 1fr);
}
.pz-locked {
  position: relative;
}
.pz-locked::after {
  content: "\1f512";
  position: absolute;
  right: -2px;
  bottom: 0;
  z-index: 1;
  font-size: 15px;
  line-height: 1;
  padding: 3px 5px;
  border-radius: 10px;
  background: var(--primary-soft);
  border: 1px solid rgba(124, 92, 255, 0.28);
  box-shadow: 0 1px 3px rgba(36, 31, 54, 0.2);
}
.tint-panel {
  width: 100%;
  margin-top: 2px;
  text-align: center;
}
.tint-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-top: 6px;
}
.tint-swatch {
  width: 44px;
  height: 44px;
  padding: 0;
  border-radius: 50%;
  border: 2px solid var(--line);
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.35);
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  line-height: 1;
  display: grid;
  place-items: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.tint-swatch.paid {
  border-style: dashed;
  opacity: 0.85;
}
.tint-swatch.on {
  border-color: var(--primary-ink);
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.45), 0 0 0 2px var(--primary);
}
.tint-swatch.on::after {
  content: "\2713";
  font-size: 16px;
  text-shadow: 0 1px 2px rgba(20, 16, 34, 0.55);
}
.tint-swatch:active {
  transform: scale(0.94);
}
@media (prefers-reduced-motion: reduce) {
  .tint-swatch:active {
    transform: none;
  }
}
.pz-dots {
  display: flex;
  gap: 4px;
  justify-content: center;
  margin: 6px 0 8px;
}
.pz-dot {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  background: var(--primary-soft);
  border: 1px solid rgba(124, 92, 255, 0.28);
}
.pz-dot.on {
  background: var(--primary);
  border-color: var(--primary);
}
.puzzle-win {
  border: 2px dashed rgba(124, 92, 255, 0.45);
  text-align: center;
}
.puzzle-win .row {
  margin-bottom: 2px;
}
.puzzle-win .mascot {
  position: static;
  z-index: auto;
  animation: none;
}
.puzzle-win .mascot.dance {
  animation: dance 0.6s ease-in-out 3;
}
@keyframes questGlint {
  0% {
    transform: scale(1);
  }
  55% {
    transform: scale(1.05);
  }
  100% {
    transform: scale(1);
  }
}
.shop-item.current .btn.primary:not(:disabled) {
  animation: questGlint 0.45s ease-out 1;
}
@media (prefers-reduced-motion: reduce) {
  .shop-item.current .btn.primary:not(:disabled) {
    animation: none;
  }
}
.bonus-chest-note {
  margin: 10px 4px 0;
}
.weekly-reward-bar {
  height: 10px;
  overflow: hidden;
  margin: -2px 0 10px;
  border-radius: var(--r-pill);
  background: var(--primary-soft);
}
.weekly-reward-bar span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background:
    linear-gradient(
      90deg,
      #39c9bd,
      #8b74ff);
  transition: width 180ms ease-out;
}
.weekly-reward-milestones {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 7px;
}
.weekly-reward-milestone {
  min-width: 0;
  padding: 8px 7px;
  border: 2px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--bg-2);
}
.weekly-reward-milestone .row {
  align-items: flex-start;
  gap: 4px;
  font-size: 12px;
}
.weekly-reward-milestone .tiny {
  margin-top: 3px;
  line-height: 1.25;
}
.weekly-reward-milestone.reached {
  border-color: var(--primary-ink);
  background: var(--primary-soft);
}
.weekly-reward-milestone.awarded {
  border-color: var(--green);
  background: var(--green-soft);
}
.weekly-reward-note {
  margin: 10px 2px 0;
}
@media (prefers-reduced-motion: reduce) {
  .weekly-reward-bar span {
    transition: none;
  }
}
.sr-only {
  position: absolute;
  width: 1px;
