name: Release checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fetch current main for version comparison
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - run: npm run test:release
      - name: Require a new release for every PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: npm run release:check
      - run: npm ci
      - run: npm run audio:check
      - run: npm run typecheck
      - run: npm run content:check
      - run: npm run test:adaptive
      - run: npm run test:smoke
      - run: npm run build
      - run: npm run test:boot
